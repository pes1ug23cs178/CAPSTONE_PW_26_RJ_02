name: s3hh_kd_f1h_h264
parent: s3h_kd_full_h264
notes: S3h distilled from the H.264-trained teacher F1h (cache/teacher_f1h) instead of F1
model:
  backbone: efficientnet_b0
  num_concepts: 10
  z_dim: 512
  head: concept
  domain:
    enabled: false
data:
  train: cache/sbi_pool/student_train.csv
  val: splits/ffpp_val.csv
  tests:
  - splits/ffpp_test.csv
  - splits/dfd_test.csv
  - splits/celebdf_test.csv
  sbi: false
  cells:
  - real
  - sbi
  - Deepfakes
  - Face2Face
  - FaceSwap
  cell_weights:
    real: 3
    sbi: 3
    Deepfakes: 1
    Face2Face: 1
    FaceSwap: 1
  augment:
    flip: 0.0
    color_jitter: 0.0
    jpeg_p: 0.0
    blur_p: 0.0
  student_degrade: true
  val_degrade: jpeg:50
  student_h264: true
loss:
  bce: 0.5
  concept: 0.0
  map: 0.0
  w_l1: 0.0001
  residual: 0.001
distill:
  enabled: true
  cache_dir: cache/teacher_f1h
  T: 4.0
  kl: 0.5
  feat: 1.0
  concept: 0.5
  map: 0.5
optim:
  lr:
    backbone: 0.001
    heads: 0.001
  weight_decay: 0.01
  epochs: 15
  steps_per_epoch: 1500
  batch_size: 64
  warmup_epochs: 1
  ema: 0.999
  grad_clip: 1.0
  precision: bf16
