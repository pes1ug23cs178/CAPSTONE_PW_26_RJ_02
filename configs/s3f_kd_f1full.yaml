name: s3f_kd_f1full
parent: s3_kd_full
notes: 'S3 recipe on full FF++ c23 (5 methods): student data = fullff_train + frozen
  SBI pool from fullff_train reals, distilled from F1-full s42 (cache_fullff/teacher)'
model:
  backbone: efficientnet_b0
  num_concepts: 10
  z_dim: 512
  head: concept
  domain:
    enabled: false
data:
  train: cache_fullff/sbi_pool/student_train.csv
  val: splits/fullff_val.csv
  tests:
  - splits/fullff_test.csv
  - splits/dfd_test.csv
  - splits/celebdf_test.csv
  - splits/dfo_test.csv
  sbi: false
  cells:
  - real
  - sbi
  - Deepfakes
  - Face2Face
  - FaceSwap
  - NeuralTextures
  - FaceShifter
  cell_weights:
    real: 3
    sbi: 3
    Deepfakes: 0.6
    Face2Face: 0.6
    FaceSwap: 0.6
    NeuralTextures: 0.6
    FaceShifter: 0.6
  augment:
    flip: 0.0
    color_jitter: 0.0
    jpeg_p: 0.0
    blur_p: 0.0
  student_degrade: true
  val_degrade: jpeg:50
loss:
  bce: 0.5
  concept: 0.0
  map: 0.0
  w_l1: 0.0001
  residual: 0.001
distill:
  enabled: true
  cache_dir: cache_fullff/teacher
  T: 4.0
  kl: 0.5
  feat: 1.0
  concept: 0.5
  map: 0.5
optim:
  lr:
    backbone: 0.001
    heads: 0.001
  weight_decay: 0.01
  epochs: 15
  steps_per_epoch: 1500
  batch_size: 64
  warmup_epochs: 1
  ema: 0.999
  grad_clip: 1.0
  precision: bf16
paths_file: configs/paths_fullff.yaml
