name: c2q_clip_sbi_quarter
parent: c2_clip_sbi
notes: C2 with SBI share lowered to 1/4 (runbook rule - C2 mixed vs C1 cross-dataset); batch 3/8 real, 1/4 SBI, 3/8 FF++ fakes
model:
  backbone: clip_vitl14_lora
  lora: {r: 16, alpha: 32, dropout: 0.1}
  freq_branch: none
  fusion: none
  head: linear
  domain: {enabled: false}
  grad_checkpointing: false
  save_trainable_only: true
data:
  train: splits/ffpp_train.csv
  val: splits/ffpp_val.csv
  tests: [splits/ffpp_test.csv, splits/dfd_test.csv, splits/celebdf_test.csv]
  sbi: true
  cells: [real, sbi, Deepfakes, Face2Face, FaceSwap]
  cell_weights: {real: 3, sbi: 2, Deepfakes: 1, Face2Face: 1, FaceSwap: 1}
  augment: {flip: 0.5, color_jitter: 0.1, jpeg_p: 0.3, jpeg_q: [60, 100], blur_p: 0.1}
optim:
  lr: {lora: 2.0e-4, heads: 1.0e-3}
  weight_decay: 0.05
  epochs: 12
  steps_per_epoch: 1500
  batch_size: 32
  warmup_epochs: 1
  ema: 0.999
  grad_clip: 1.0
  precision: bf16
