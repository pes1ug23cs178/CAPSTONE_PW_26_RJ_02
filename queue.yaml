# GPU run queue (see runbook "GPU run queue"). queue_runner.py re-reads this file between jobs
# and runs the first pending job (in file order) whose `after` dependency is done.
jobs:
  - name: b1_swin_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/b1_swin.yaml --seed 42
  - name: smoke_grace_g2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/g2_dct.yaml --override name=smoke_g2 optim.epochs=1 optim.steps_per_epoch=30 data.val_limit=400 --no-test-eval
  - name: landmarks_ffpp_real
    cmd: python scripts/run_snapshot.py -- python scripts/extract_landmarks.py
  - name: b1_swin_s42_r2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/b1_swin.yaml --seed 42
  - name: landmarks_ffpp_test_real
    cmd: python scripts/run_snapshot.py -- python scripts/extract_landmarks.py --splits ffpp_test --no-check-image
  - name: sbi_check_full
    cmd: python scripts/run_snapshot.py -- python scripts/sbi_check.py
    after: landmarks_ffpp_real
  - name: sbi_eval_sets
    cmd: python scripts/run_snapshot.py -- python scripts/make_sbi_sets.py
    after: landmarks_ffpp_test_real
  - name: b2_swin_dann_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/b2_swin_dann.yaml --seed 42
  - name: old_ckpt_ffpp_v2_eval
    cmd: python scripts/run_snapshot.py -- python scripts/eval_old_ckpt.py --ckpt outputs_ffpp_v2_20260423_172121/best_swin_deepfake.pth --name ffpp_v2
  - name: old_ckpt_ffpp_v2_eval_r2
    cmd: python scripts/run_snapshot.py -- python scripts/eval_old_ckpt.py --ckpt outputs_ffpp_v2_20260423_172121/best_swin_deepfake.pth --name ffpp_v2
  - name: b2f_swin_dann_fake_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/b2f_swin_dann_fake.yaml --seed 42
  - name: c1_clip_lora_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/c1_clip_lora.yaml --seed 42
  - name: c2_clip_sbi_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/c2_clip_sbi.yaml --seed 42
    after: sbi_check_full
  - name: b2_swin_dann_s42_r2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/b2_swin_dann.yaml --seed 42
  - name: c2q_clip_sbi_quarter_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/c2q_clip_sbi_quarter.yaml --seed 42
  - name: pick_sbi_share
    cmd: python scripts/pick_sbi_share.py
    after: c2q_clip_sbi_quarter_s42
  - name: b2f_swin_dann_fake_s42_r2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/b2f_swin_dann_fake.yaml --seed 42
  - name: g1_concepts_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/g1_concepts.yaml --seed 42
    after: pick_sbi_share
  - name: g2_dct_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/g2_dct.yaml --seed 42
    after: smoke_grace_g2
  - name: g1r_concepts_res1e2_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/g1r_concepts_res1e2.yaml --seed 42
  - name: pick_residual
    cmd: python scripts/pick_residual.py
    after: g1r_concepts_res1e2_s42
  - name: g2_fft_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/g2_fft.yaml --seed 42
    after: pick_residual
  - name: g1_concept_auc_rescore
    cmd: python scripts/rescore_concepts.py g1_concepts_s42 g2_dct_s42
  - name: g3_full_s42
    cmd: python scripts/run_snapshot.py -- "python scripts/make_g3_configs.py && python train.py --config configs/g3_full.yaml --seed 42"
    after: g2_fft_s42
  - name: a3_linear_head_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/a3_linear_head.yaml --seed 42
    after: g3_full_s42
  - name: robustness_eval
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models b1_swin b2_swin_dann b2f_swin_dann_fake c1_clip_lora c2_clip_sbi g1_concepts g2_dct g2_fft g3_full a3_linear_head
    after: a3_linear_head_s42
  # ---- final-model fix (user request 2026-11-18): harder val selection, DANN on patch features, G2-DCT base ----
  - name: smoke_f2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/f2_grace_pdann.yaml --override name=smoke_f2 optim.epochs=1 optim.steps_per_epoch=30 data.val_limit=400 --no-test-eval
  - name: f1_grace_dct_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/f1_grace_dct.yaml --seed 42
    after: smoke_f2
  - name: f2_grace_pdann_s42
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/f2_grace_pdann.yaml --seed 42
  - name: robustness_eval_final
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models f1_grace_dct f2_grace_pdann --out results/robustness_final_candidates.csv
    after: f2_grace_pdann_s42
  - name: pick_final
    cmd: python scripts/run_snapshot.py -- python scripts/pick_final.py
    after: f2_grace_pdann_s42
  - name: sbi_pool
    cmd: python scripts/run_snapshot.py -- python scripts/make_sbi_pool.py
    after: landmarks_ffpp_real
  - name: teacher_cache
    cmd: python scripts/run_snapshot.py -- python scripts/cache_teacher.py --teacher auto
    after: pick_final
  - name: s0_student_s42
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s0_student.yaml --seed 42
    after: sbi_pool
  - name: teacher_cache_r2
    cmd: python scripts/run_snapshot.py -- python scripts/cache_teacher.py --teacher auto
    after: pick_final
  - name: teacher_cache_r3
    cmd: python scripts/run_snapshot.py -- python scripts/cache_teacher.py --teacher auto
    after: pick_final
  - name: s2_kd_logits_s42_r2
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s2_kd_logits.yaml --seed 42
    after: teacher_cache_r3
  - name: s3_kd_full_s42_r2
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s3_kd_full.yaml --seed 42
    after: teacher_cache_r3
  - name: final_s1
    cmd: python scripts/run_snapshot.py -- python scripts/train_final.py --seed 1
    after: pick_final
  - name: s3_kd_full_s1
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s3_kd_full.yaml --seed 1
    after: s3_kd_full_s42_r2
  - name: tsne_figure
    cmd: python scripts/run_snapshot.py -- python scripts/plot_tsne.py --models b1_swin g2_dct g3_full final
    after: pick_final
  - name: export_onnx
    cmd: python scripts/run_snapshot.py -- python scripts/export_onnx.py --out release/grace_student.onnx
    after: s3_kd_full_s42_r2
  - name: agreement
    cmd: python scripts/run_snapshot.py -- python scripts/agreement.py
    after: s3_kd_full_s42_r2
  - name: benchmark
    cmd: python scripts/run_snapshot.py -- python scripts/benchmark.py --models b1_swin final s0_student s3_kd_full --onnx release/grace_student.onnx
    after: export_onnx
  - name: agreement_r2
    cmd: python scripts/run_snapshot.py -- python scripts/agreement.py
    after: s3_kd_full_s42_r2
  - name: calibrate
    cmd: python scripts/run_snapshot.py -- python scripts/calibrate.py --models b1_swin final s3_kd_full
    after: s3_kd_full_s42_r2
  - name: fig_explanations
    cmd: python scripts/run_snapshot.py -- python scripts/fig_explanations.py
    after: s3_kd_full_s42_r2
  - name: fig_explanations_r2
    cmd: python scripts/run_snapshot.py -- python scripts/fig_explanations.py
    after: s3_kd_full_s42_r2
  - name: explain_eval
    cmd: python scripts/run_snapshot.py -- python scripts/explain_eval.py
    after: s3_kd_full_s42_r2
  - name: app_check
    cmd: python scripts/run_snapshot.py -- python scripts/app_check.py
    after: calibrate
  - name: app_check_r2
    cmd: python scripts/run_snapshot.py -- python scripts/app_check.py
    after: export_onnx
  - name: final_eval_all
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models b1_swin b2_swin_dann b2f_swin_dann_fake c1_clip_lora c2_clip_sbi g1_concepts g1r_concepts_res1e2 c2q_clip_sbi_quarter g2_dct g2_fft g3_full a3_linear_head f1_grace_dct f2_grace_pdann s0_student s2_kd_logits s3_kd_full --seeds 42 1
    after: s3_kd_full_s1
  - name: make_tables
    cmd: python scripts/run_snapshot.py -- python scripts/make_tables.py
    after: final_eval_all
  - name: make_summary
    cmd: python scripts/run_snapshot.py -- python scripts/make_summary.py
    after: make_tables
  - name: make_release
    cmd: python scripts/run_snapshot.py -- python scripts/make_release.py
    after: make_tables
  # ---- optional fillers, then the extra FF++ + DFD experiment, then refresh results ----
  - name: final_s2
    cmd: python scripts/run_snapshot.py -- python scripts/train_final.py --seed 2
    after: pick_final
  - name: s3_kd_full_s2
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s3_kd_full.yaml --seed 2
    after: s3_kd_full_s42_r2
  - name: d2_unsup_adapt_s42
    cmd: python scripts/run_snapshot.py -- "python scripts/make_adapt_splits.py && python scripts/make_extra_configs.py && python train.py --config configs/d2_unsup_adapt.yaml --seed 42"
    after: pick_final
  - name: b1_swin_s1
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/b1_swin.yaml --seed 1
  - name: x1_ffpp_dfd_s42
    cmd: python scripts/run_snapshot.py -- "python scripts/make_adapt_splits.py && python scripts/make_extra_configs.py && python train.py --config configs/x1_ffpp_dfd.yaml --seed 42"
    after: pick_final
  - name: final_eval_all_v2
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models b1_swin b2_swin_dann b2f_swin_dann_fake c1_clip_lora c2_clip_sbi g1_concepts g1r_concepts_res1e2 c2q_clip_sbi_quarter g2_dct g2_fft g3_full a3_linear_head f1_grace_dct f2_grace_pdann s0_student s2_kd_logits s3_kd_full d2_unsup_adapt --seeds 42 1 2
    after: x1_ffpp_dfd_s42
  - name: make_tables_v2
    cmd: python scripts/run_snapshot.py -- "python scripts/make_tables.py && python scripts/make_summary.py && python scripts/make_release.py"
    after: final_eval_all_v2
  # Day 6 fillers (added 19 Nov 12:55): extra student seeds so S0 vs S2 vs S3 compare over 3 seeds each, X1 seed 1, then a v3 refresh.
  - name: s0_student_s1
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s0_student.yaml --seed 1
    after: make_tables_v2
  - name: s0_student_s2
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s0_student.yaml --seed 2
    after: s0_student_s1
  - name: s2_kd_logits_s1
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s2_kd_logits.yaml --seed 1
    after: s0_student_s2
  - name: s2_kd_logits_s2
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s2_kd_logits.yaml --seed 2
    after: s2_kd_logits_s1
  - name: x1_ffpp_dfd_s1
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/x1_ffpp_dfd.yaml --seed 1
    after: s2_kd_logits_s2
  - name: final_eval_all_v3
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models b1_swin b2_swin_dann b2f_swin_dann_fake c1_clip_lora c2_clip_sbi g1_concepts g1r_concepts_res1e2 c2q_clip_sbi_quarter g2_dct g2_fft g3_full a3_linear_head f1_grace_dct f2_grace_pdann s0_student s2_kd_logits s3_kd_full d2_unsup_adapt --seeds 42 1 2
    after: x1_ffpp_dfd_s1
  - name: make_tables_v3
    cmd: python scripts/run_snapshot.py -- "python scripts/make_tables.py && python scripts/make_summary.py && python scripts/make_release.py"
    after: final_eval_all_v3
  # Day 6 night fillers (added 19 Nov 19:45): last missing seeds (B1 s2, X1 s2, D2 s1), then a v4 refresh.
  - name: b1_swin_s2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/b1_swin.yaml --seed 2
    after: make_tables_v3
  - name: x1_ffpp_dfd_s2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/x1_ffpp_dfd.yaml --seed 2
    after: b1_swin_s2
  - name: d2_unsup_adapt_s1
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/d2_unsup_adapt.yaml --seed 1
    after: x1_ffpp_dfd_s2
  - name: final_eval_all_v4
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models b1_swin b2_swin_dann b2f_swin_dann_fake c1_clip_lora c2_clip_sbi g1_concepts g1r_concepts_res1e2 c2q_clip_sbi_quarter g2_dct g2_fft g3_full a3_linear_head f1_grace_dct f2_grace_pdann s0_student s2_kd_logits s3_kd_full d2_unsup_adapt --seeds 42 1 2
    after: d2_unsup_adapt_s1
  - name: make_tables_v4
    cmd: python scripts/run_snapshot.py -- "python scripts/make_tables.py && python scripts/make_summary.py && python scripts/make_release.py"
    after: final_eval_all_v4
  # Day 7 fillers (added 20 Nov 01:20): X1 robustness on its held-out sets only (DFD is in its training data), D2 seed 2.
  - name: eval_x1_robustness
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models x1_ffpp_dfd --seeds 42 1 2 --splits ffpp_test celebdf_test --out results/robustness_x1.csv
    after: make_tables_v4
  - name: d2_unsup_adapt_s2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/d2_unsup_adapt.yaml --seed 2
    after: eval_x1_robustness
  - name: final_eval_all_v5
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models b1_swin b2_swin_dann b2f_swin_dann_fake c1_clip_lora c2_clip_sbi g1_concepts g1r_concepts_res1e2 c2q_clip_sbi_quarter g2_dct g2_fft g3_full a3_linear_head f1_grace_dct f2_grace_pdann s0_student s2_kd_logits s3_kd_full d2_unsup_adapt --seeds 42 1 2
    after: d2_unsup_adapt_s2
  - name: make_tables_v5
    cmd: python scripts/run_snapshot.py -- "python scripts/make_tables.py && python scripts/make_summary.py && python scripts/make_release.py"
    after: final_eval_all_v5
  # Day 7 extension (added 20 Nov 05:30): does the X1 teacher's Celeb-DF gain pass to a student trained on FF++ + SBI only?
  # Separate cache (cache/teacher_x1) so the F1 cache used by S0-S3, agreement and the app stays untouched.
  - name: teacher_cache_x1
    cmd: python scripts/run_snapshot.py -- python scripts/cache_teacher.py --teacher x1_ffpp_dfd_s42_20261119-1056 --out teacher_x1
    after: make_tables_v5
  - name: s3x_kd_from_x1_s42
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s3x_kd_from_x1.yaml --seed 42
    after: teacher_cache_x1
  - name: s3x_kd_from_x1_s1
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s3x_kd_from_x1.yaml --seed 1
    after: s3x_kd_from_x1_s42
  - name: s3x_kd_from_x1_s2
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s3x_kd_from_x1.yaml --seed 2
    after: s3x_kd_from_x1_s1
  # Day 7 extension 2 (added 20 Nov 08:00): data vs teacher for students. Student data = FF++ + SBI + DFD (cache/adapt/student_x_train.csv).
  # S0x: no teacher; S3xx: distilled from X1 (cache/teacher_x1x). DFD is not held out for these; compare on Celeb-DF.
  - name: teacher_cache_x1x
    cmd: python scripts/run_snapshot.py -- "python scripts/make_student_x.py && python scripts/cache_teacher.py --teacher x1_ffpp_dfd_s42_20261119-1056 --csv adapt/student_x_train.csv --out teacher_x1x"
    after: s3x_kd_from_x1_s2
  - name: s0x_student_dfd_s42
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s0x_student_dfd.yaml --seed 42
    after: teacher_cache_x1x
  - name: s3xx_kd_x1_dfd_s42
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s3xx_kd_x1_dfd.yaml --seed 42
    after: s0x_student_dfd_s42
  - name: s0x_student_dfd_s1
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s0x_student_dfd.yaml --seed 1
    after: s3xx_kd_x1_dfd_s42
  - name: s3xx_kd_x1_dfd_s1
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s3xx_kd_x1_dfd.yaml --seed 1
    after: s0x_student_dfd_s1
  - name: s0x_student_dfd_s2
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s0x_student_dfd.yaml --seed 2
    after: s3xx_kd_x1_dfd_s1
  - name: s3xx_kd_x1_dfd_s2
    cmd: python scripts/run_snapshot.py -- python distill.py --config configs/s3xx_kd_x1_dfd.yaml --seed 2
    after: s0x_student_dfd_s2
  # Official Celeb-DF test list received 20 Nov (splits/official/List_of_testing_videos.txt; 516 of 518 videos on disk).
  # Re-split, re-evaluate every model on it, sync experiments.csv, rebuild tables; then retrain D2 (its unlabelled pool
  # held 462 official test videos) and refresh again.
  - name: celebdf_official_prepare
    cmd: python scripts/run_snapshot.py -- python scripts/celebdf_official.py prepare
    after: s3xx_kd_x1_dfd_s2
  - name: final_eval_all_v6
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models b1_swin b2_swin_dann b2f_swin_dann_fake c1_clip_lora c2_clip_sbi g1_concepts g1r_concepts_res1e2 c2q_clip_sbi_quarter g2_dct g2_fft g3_full a3_linear_head f1_grace_dct f2_grace_pdann s0_student s2_kd_logits s3_kd_full d2_unsup_adapt --seeds 42 1 2
    after: celebdf_official_prepare
  - name: eval_extras_official
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models x1_ffpp_dfd s3x_kd_from_x1 s0x_student_dfd s3xx_kd_x1_dfd --seeds 42 1 2 --splits ffpp_test celebdf_test --out results/robustness_extra.csv
    after: final_eval_all_v6
  - name: make_tables_v6
    cmd: python scripts/run_snapshot.py -- "python scripts/celebdf_official.py sync && python scripts/make_tables.py && python scripts/make_summary.py && python scripts/fig_explanations.py && python scripts/make_release.py"
    after: eval_extras_official
  - name: d2_official_s42
    cmd: python scripts/run_snapshot.py -- "python scripts/make_adapt_splits.py && python train.py --config configs/d2_unsup_adapt.yaml --seed 42"
    after: make_tables_v6
  - name: d2_official_s1
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/d2_unsup_adapt.yaml --seed 1
    after: d2_official_s42
  - name: d2_official_s2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/d2_unsup_adapt.yaml --seed 2
    after: d2_official_s1
  - name: final_eval_all_v7
    cmd: python scripts/run_snapshot.py -- python scripts/eval_all.py --models b1_swin b2_swin_dann b2f_swin_dann_fake c1_clip_lora c2_clip_sbi g1_concepts g1r_concepts_res1e2 c2q_clip_sbi_quarter g2_dct g2_fft g3_full a3_linear_head f1_grace_dct f2_grace_pdann s0_student s2_kd_logits s3_kd_full d2_unsup_adapt --seeds 42 1 2
    after: d2_official_s2
  - name: make_tables_v7
    cmd: python scripts/run_snapshot.py -- "python scripts/celebdf_official.py sync && python scripts/make_tables.py && python scripts/make_summary.py && python scripts/make_release.py"
    after: final_eval_all_v7
  # Paper (21 Nov): two more seeds for the single-seed ablation rows C1, C2, G1, G2 so every step of the chain is a
  # 3-seed mean; then re-evaluate (robustness grid), rebuild tables, and compute bootstrap CIs (scripts/paper_stats.py).
  - name: paper_c1_s1
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/c1_clip_lora.yaml --seed 1
  - name: paper_c1_s2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/c1_clip_lora.yaml --seed 2
  - name: paper_g2_s1
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/g2_dct.yaml --seed 1
  - name: paper_g2_s2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/g2_dct.yaml --seed 2
  - name: paper_g1_s1
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/g1_concepts.yaml --seed 1
  - name: paper_g1_s2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/g1_concepts.yaml --seed 2
  - name: paper_c2_s1
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/c2_clip_sbi.yaml --seed 1
  - name: paper_c2_s2
    cmd: python scripts/run_snapshot.py -- python train.py --config configs/c2_clip_sbi.yaml --seed 2
  # Weekend plan (21-23 Nov, until Monday morning), all for the paper, in priority order:
  # (1) fair baselines under our protocol: R1 UnivFD-style frozen-CLIP linear probe, R2 SBI reproduction (EffNet-B4,
